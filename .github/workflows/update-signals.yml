name: Update signal data

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the updater
        env:
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python update_signals.py

      - name: Commit updated data if anything changed
        run: |
          git config user.name  "signal-updater"
          git config user.email "actions@users.noreply.github.com"
          git add signals.json news.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily signal update: $(date -u +'%Y-%m-%d')"
            git push
          fi
